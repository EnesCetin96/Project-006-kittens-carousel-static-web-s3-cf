AWSTemplateFormatVersion: 2010-09-09
Description: |
  This cfn file is used for creating a template which runs S3 static
  web-hosting using cloudfront distribution.

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", "us-east-1"]
        AssertDescription: This stack must be deployed in us-east-1 because CloudFront only accepts ACM certificates issued in us-east-1.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing Route 53 hosted zone that will hold the record for the app (e.g. clarusway.click)
  myDomainName:
    Description: Type your subdomain name for example "kittens.clarusway.click"
    Type: String
    AllowedPattern: (?!-)[a-z0-9-.]{3,63}(?<!-)

Resources:

  myS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref myDomainName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  mys3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref myS3Bucket # Required
      PolicyDocument:  # Required
        Version: 2012-10-17
        Statement:
          - Action:
              - 's3:GetObject'
            Effect: Allow
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref myS3Bucket
                - /*
            Principal: '*'

  myCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref myDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref myDomainName
          HostedZoneId: !Ref HostedZoneId

  myCloudFrontDist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref myDomainName
        Comment: !Sub "${myDomainName} distribution"
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: !Sub "${myDomainName}-origin"
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        Origins:
          - CustomOriginConfig:
              OriginProtocolPolicy: http-only
            DomainName: !Select [2, !Split ["/", !GetAtt myS3Bucket.WebsiteURL]]
            Id: !Sub "${myDomainName}-origin"
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref myCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  myRoute53Record:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - AliasTarget:
            DNSName: !GetAtt myCloudFrontDist.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
          Name: !Ref myDomainName
          Type: A

Outputs:

  BucketName:
    Description: Name of S3 Bucket for Kittens Website
    Value: !Ref myS3Bucket

  CloudfrontEndpoint:
    Description: Endpoint for Kittens Cloudfront
    Value: !GetAtt myCloudFrontDist.DomainName

  FullDomainName:
    Description: Full DomainName of My App
    Value: !Ref myDomainName
